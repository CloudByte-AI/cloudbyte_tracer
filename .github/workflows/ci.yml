name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e './python[all]' -r python/requirements-test.txt
      - run: python -m pytest python/tests -q
      - run: python -m build python --outdir artifacts/python
      # Globs, not version numbers, so a version bump cannot break CI.
      - run: python scripts/install-python.py --wheel artifacts/python/*.whl
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.14'
        with:
          name: python-packages
          path: artifacts/python/*
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: mkdir -p ../artifacts && npm pack --pack-destination ../artifacts
      - run: node ../scripts/install-js.mjs ../artifacts/cloudbyte-tracer-*.tgz
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: node-package
          path: artifacts/*.tgz
